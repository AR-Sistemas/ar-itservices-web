<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="AR SDD: un pedido pasa por especificación, desarrollo y verificaciones hasta quedar aprobado">
<style>
#ars-escena{opacity:0;animation:ars-escena 10s ease-in-out infinite}
@keyframes ars-escena{0%{opacity:0}4%,88%{opacity:1}96%,100%{opacity:0}}
#ars-token{animation:ars-token 10s ease-in-out infinite}
@keyframes ars-token{0%,8%{transform:translateX(0px)}18%,28%{transform:translateX(210px)}38%,48%{transform:translateX(420px)}58%,68%{transform:translateX(630px)}78%,100%{transform:translateX(840px)}}
#ars-track{transform-box:fill-box;transform-origin:0 50%;animation:ars-track 10s linear infinite}
@keyframes ars-track{0%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}
#ars-nodo-2{animation:ars-n2 10s linear infinite}
@keyframes ars-n2{0%,16%{fill-opacity:0;stroke:#706F6F}19%,100%{fill-opacity:1;stroke:#FF000D}}
