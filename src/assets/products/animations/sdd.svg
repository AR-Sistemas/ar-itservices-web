#ars-nodo-5{animation:ars-n5 10s linear infinite}
@keyframes ars-n5{0%,77%{fill-opacity:0;stroke:#706F6F}80%,100%{fill-opacity:1;stroke:#FF000D}}
.ars-blk{transform-box:fill-box;transform-origin:50% 50%}
#ars-blk-1{animation:ars-blk1 10s ease-out infinite}
#ars-blk-2{animation:ars-blk2 10s ease-out infinite}
#ars-blk-3{animation:ars-blk3 10s ease-out infinite}
@keyframes ars-blk1{0%,35%{opacity:0;transform:scale(0.3)}42%,100%{opacity:1;transform:scale(1)}}
@keyframes ars-blk2{0%,38%{opacity:0;transform:scale(0.3)}45%,100%{opacity:1;transform:scale(1)}}
@keyframes ars-blk3{0%,41%{opacity:0;transform:scale(0.3)}48%,100%{opacity:1;transform:scale(1)}}
#ars-chk-1{animation:ars-chk1 10s linear infinite}
#ars-chk-2{animation:ars-chk2 10s linear infinite}
#ars-chk-3{animation:ars-chk3 10s linear infinite}
@keyframes ars-chk1{0%,55%{opacity:0.25}58%,100%{opacity:1}}
@keyframes ars-chk2{0%,59%{opacity:0.25}62%,100%{opacity:1}}
@keyframes ars-chk3{0%,63%{opacity:0.25}66%,100%{opacity:1}}
#ars-tilde{stroke-dasharray:80;animation:ars-tilde 10s ease-out infinite}
@keyframes ars-tilde{0%,79%{stroke-dashoffset:80}86%,100%{stroke-dashoffset:0}}
</style>
