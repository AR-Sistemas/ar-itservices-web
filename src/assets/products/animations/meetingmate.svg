.mm-etiqueta{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:700;letter-spacing:2px;fill:#FF666E}
#mm-etiqueta-a{animation:mm-etiqueta-a 10s ease-in-out infinite}#mm-etiqueta-b{animation:mm-etiqueta-b 10s ease-in-out infinite}#mm-etiqueta-c{animation:mm-etiqueta-c 10s ease-in-out infinite}#mm-etiqueta-d{animation:mm-etiqueta-d 10s ease-in-out infinite}
@keyframes mm-etiqueta-a{0%,6%{opacity:0;transform:translateY(8px)}12%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes mm-etiqueta-b{0%,21%{opacity:0;transform:translateY(8px)}29%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes mm-etiqueta-c{0%,52%{opacity:0;transform:translateY(8px)}60%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
@keyframes mm-etiqueta-d{0%,64%{opacity:0;transform:translateY(8px)}72%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
#mm-ramas{opacity:0;animation:mm-ramas 10s ease-in-out infinite}
