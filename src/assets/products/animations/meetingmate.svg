<rect x="492" y="280" width="230" height="16" rx="8" fill="#C8D6EE"/>
<rect x="492" y="306" width="160" height="12" rx="6" fill="#DFE7F5"/>
</g>
<g id="mm-l2">
<circle cx="470" cy="344" r="10" fill="#00D4FF"/>
<rect x="492" y="336" width="230" height="16" rx="8" fill="#C8D6EE"/>
<rect x="492" y="362" width="190" height="12" rx="6" fill="#DFE7F5"/>
</g>
<g id="mm-l3">
<circle cx="470" cy="400" r="10" fill="#0066FF"/>
<rect x="492" y="392" width="230" height="16" rx="8" fill="#C8D6EE"/>
<rect x="492" y="418" width="150" height="12" rx="6" fill="#DFE7F5"/>
</g>
<g id="mm-l4">
<circle cx="470" cy="456" r="10" fill="#00D4FF"/>
<rect x="492" y="448" width="230" height="16" rx="8" fill="#C8D6EE"/>
<rect x="492" y="474" width="170" height="12" rx="6" fill="#DFE7F5"/>
</g>
</g>
<polygon points="772,400 796,430 772,460" fill="#00D4FF"/>
<g id="mm-resumen">
<rect x="820" y="180" width="320" height="230" rx="20" fill="#FFFFFF"/>
<rect x="840" y="200" width="160" height="16" rx="8" fill="#0066FF"/>
<rect x="840" y="236" width="280" height="12" rx="6" fill="#C8D6EE"/>
<rect x="840" y="262" width="240" height="12" rx="6" fill="#C8D6EE"/>
<rect x="840" y="288" width="260" height="12" rx="6" fill="#C8D6EE"/>
<rect x="840" y="314" width="180" height="12" rx="6" fill="#C8D6EE"/>
</g>
<g id="mm-tareas">
<rect x="820" y="440" width="320" height="240" rx="20" fill="#FFFFFF"/>
<rect x="840" y="460" width="140" height="16" rx="8" fill="#00D4FF"/>
<g id="mm-tarea-1">
<rect x="844" y="500" width="30" height="30" rx="6" fill="none" stroke="#0066FF" stroke-width="4"/>
<path d="M850 515 L858 523 L869 508" fill="none" stroke="#0066FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="892" y="507" width="210" height="16" rx="8" fill="#C8D6EE"/>
</g>
<g id="mm-tarea-2">
<rect x="844" y="560" width="30" height="30" rx="6" fill="none" stroke="#0066FF" stroke-width="4"/>
<path d="M850 575 L858 583 L869 568" fill="none" stroke="#0066FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="892" y="567" width="190" height="16" rx="8" fill="#C8D6EE"/>
</g>
<g id="mm-tarea-3">
<rect x="844" y="620" width="30" height="30" rx="6" fill="none" stroke="#0066FF" stroke-width="4"/>
<path d="M850 635 L858 643 L869 628" fill="none" stroke="#0066FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="892" y="627" width="200" height="16" rx="8" fill="#C8D6EE"/>
</g>
</g>
</g>
</svg>
