#mm-paso-a{animation:mm-paso-a 10s ease-in-out infinite}#mm-paso-b{animation:mm-paso-b 10s ease-in-out infinite}#mm-paso-c{animation:mm-paso-c 10s ease-in-out infinite}#mm-paso-d{animation:mm-paso-d 10s ease-in-out infinite}
@keyframes mm-paso-a{0%,13%{fill:#706F6F;transform:scale(1)}16%,26%{fill:#FF666E;transform:scale(1.22)}30%,100%{fill:#ADADB2;transform:scale(1)}}
