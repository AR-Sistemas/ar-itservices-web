<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="MeetingMate: una reunión se transcribe y genera un resumen y las tareas acordadas">
<style>
#mm-escena{opacity:0;animation:mm-escena 10s ease-in-out infinite}
@keyframes mm-escena{0%{opacity:0}4%,88%{opacity:1}96%,100%{opacity:0}}
.mm-onda{transform-box:fill-box;transform-origin:50% 50%;animation:mm-onda 1s ease-in-out infinite}
.mm-onda-b{animation-duration:0.5s}
@keyframes mm-onda{0%,100%{transform:scaleY(0.35)}50%{transform:scaleY(1)}}
#mm-l1{animation:mm-in-a 10s ease-out infinite}
#mm-l2{animation:mm-in-b 10s ease-out infinite}
#mm-l3{animation:mm-in-c 10s ease-out infinite}
#mm-l4{animation:mm-in-d 10s ease-out infinite}
#mm-resumen{animation:mm-in-e 10s ease-out infinite}
#mm-tarea-1{animation:mm-in-f 10s ease-out infinite}
#mm-tarea-2{animation:mm-in-g 10s ease-out infinite}
#mm-tarea-3{animation:mm-in-h 10s ease-out infinite}
@keyframes mm-in-a{0%,18%{opacity:0;transform:translateY(14px)}25%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-b{0%,27%{opacity:0;transform:translateY(14px)}35%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-c{0%,37%{opacity:0;transform:translateY(14px)}45%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-d{0%,47%{opacity:0;transform:translateY(14px)}55%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-e{0%,53%{opacity:0;transform:translateY(14px)}63%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-f{0%,63%{opacity:0;transform:translateY(14px)}71%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-g{0%,70%{opacity:0;transform:translateY(14px)}78%,100%{opacity:1;transform:translateY(0)}}
@keyframes mm-in-h{0%,77%{opacity:0;transform:translateY(14px)}85%,100%{opacity:1;transform:translateY(0)}}
</style>
<g id="mm-escena">
<g id="mm-personas">
<rect x="118" y="430" width="104" height="110" rx="40" fill="#0066FF"/>
<rect x="248" y="430" width="104" height="110" rx="40" fill="#00D4FF"/>
<circle cx="170" cy="360" r="52" fill="#0066FF"/>
<circle cx="300" cy="360" r="52" fill="#00D4FF"/>
</g>
<g id="mm-ondas">
<rect class="mm-onda" x="180" y="190" width="10" height="60" rx="5" fill="#00D4FF"/>
<rect class="mm-onda mm-onda-b" x="200" y="190" width="10" height="60" rx="5" fill="#00D4FF"/>
<rect class="mm-onda" x="220" y="190" width="10" height="60" rx="5" fill="#00D4FF"/>
<rect class="mm-onda mm-onda-b" x="240" y="190" width="10" height="60" rx="5" fill="#00D4FF"/>
<rect class="mm-onda" x="260" y="190" width="10" height="60" rx="5" fill="#00D4FF"/>
<rect class="mm-onda mm-onda-b" x="280" y="190" width="10" height="60" rx="5" fill="#00D4FF"/>
</g>
<polygon points="372,400 396,430 372,460" fill="#00D4FF"/>
<g id="mm-transcripcion">
<rect x="440" y="180" width="320" height="500" rx="20" fill="#FFFFFF"/>
<rect x="440" y="180" width="320" height="64" rx="20" fill="#0066FF"/>
<g id="mm-l1">
