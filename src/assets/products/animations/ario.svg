<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ario: los documentos entran, se leen, se extraen los campos y salen datos ordenados en una tabla">
<style>
#ario-salida-ok{opacity:0;animation:ario-ok 10s ease-in-out infinite}
@keyframes ario-ok{0%,70%{opacity:0;transform:scale(.7)}76%,88%{opacity:1;transform:scale(1)}94%,100%{opacity:0;transform:scale(1)}}
.ario-etiqueta{font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:700;letter-spacing:2px;fill:#FF666E}
#ario-etiqueta-a{animation:ario-etiqueta-a 10s ease-in-out infinite}#ario-etiqueta-b{animation:ario-etiqueta-b 10s ease-in-out infinite}#ario-etiqueta-c{animation:ario-etiqueta-c 10s ease-in-out infinite}
@keyframes ario-etiqueta-a{0%,5%{opacity:0;transform:translateY(8px)}12%,35%{opacity:1;transform:translateY(0)}43%,100%{opacity:.3;transform:translateY(0)}}
@keyframes ario-etiqueta-b{0%,28%{opacity:0;transform:translateY(8px)}36%,67%{opacity:1;transform:translateY(0)}75%,100%{opacity:.3;transform:translateY(0)}}
@keyframes ario-etiqueta-c{0%,53%{opacity:0;transform:translateY(8px)}61%,90%{opacity:1;transform:translateY(0)}96%,100%{opacity:0;transform:translateY(0)}}
#ario-progreso{opacity:0;animation:ario-progreso 10s ease-in-out infinite}
@keyframes ario-progreso{0%,7%{opacity:0}14%,88%{opacity:1}96%,100%{opacity:0}}
#ario-doc-atras{opacity:0;animation:ario-doc-atras 10s ease-out infinite}#ario-doc-frente{opacity:0;animation:ario-doc-frente 10s ease-out infinite}
@keyframes ario-doc-atras{0%,5%{opacity:0;transform:translateX(-80px)}13%,86%{opacity:1;transform:translateX(0)}94%,100%{opacity:0}}@keyframes ario-doc-frente{0%,12%{opacity:0;transform:translateX(-80px)}20%,86%{opacity:1;transform:translateX(0)}94%,100%{opacity:0}}
#ario-scan{opacity:0;animation:ario-scan 10s linear infinite}
@keyframes ario-scan{0%,14%{opacity:0;transform:translateY(0)}16%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(322px)}31%,100%{opacity:0;transform:translateY(322px)}}
#ario-lector{opacity:0;animation:ario-lector 10s ease-in-out infinite}
@keyframes ario-lector{0%,32%{opacity:0;transform:translateX(-24px)}38%,82%{opacity:1;transform:translateX(0)}88%,100%{opacity:0;transform:translateX(0)}}
#ario-pkt-1,#ario-pkt-2,#ario-pkt-3{opacity:0}
