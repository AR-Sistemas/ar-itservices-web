<g id="ario-salida-ok">
<circle cx="1030" cy="300" r="30" fill="#FF666E"/>
<path d="M1015 300 L1026 311 L1047 287" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="ario-progreso">
