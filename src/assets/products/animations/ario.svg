#ario-pkt-3{animation:ario-pkt3 10s linear infinite}
@keyframes ario-pkt1{0%,39%{opacity:0;transform:translateX(0)}41%{opacity:1;transform:translateX(0)}57%{opacity:1;transform:translateX(258px)}59%,100%{opacity:0;transform:translateX(258px)}}
@keyframes ario-pkt2{0%,49%{opacity:0;transform:translateX(0)}51%{opacity:1;transform:translateX(0)}67%{opacity:1;transform:translateX(258px)}69%,100%{opacity:0;transform:translateX(258px)}}
@keyframes ario-pkt3{0%,59%{opacity:0;transform:translateX(0)}61%{opacity:1;transform:translateX(0)}77%{opacity:1;transform:translateX(258px)}79%,100%{opacity:0;transform:translateX(258px)}}
#ario-hl-1{opacity:0;animation:ario-hl1 10s linear infinite}
