#ario-hl-2{opacity:0;animation:ario-hl2 10s linear infinite}
@keyframes ario-hl2{0%,38%{opacity:0}40%,48%{opacity:1}50%,100%{opacity:0}}
#ario-hl-3{opacity:0;animation:ario-hl3 10s linear infinite}
